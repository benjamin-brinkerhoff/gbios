name: gbios
options:
  bundleIdPrefix: com.gbios
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  GBoardApp:
    type: application
    platform: iOS
    sources:
      - path: GBoardApp
      - path: Shared
    info:
      path: GBoardApp/Info.plist
      properties:
        CFBundleDisplayName: gbios
        CFBundleName: GBoardApp
        CFBundleExecutable: GBoardApp
        CFBundleIdentifier: com.gbios.app
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIDeviceFamily:
          - 1
          - 2
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "gbios uses the microphone for Gemini Rambler natural voice dictation."
        NSSpeechRecognitionUsageDescription: "gbios uses speech recognition to convert spoken words into text in real time."
        NSCameraUsageDescription: "gbios uses the camera for Live OCR Text Scanning."
    entitlements:
      path: GBoardApp/GBoardApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbios.app
        PRODUCT_NAME: GBoardApp
        PRODUCT_MODULE_NAME: GBoardApp
        INFOPLIST_FILE: GBoardApp/Info.plist
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.2.0
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
    dependencies:
      - target: GBoardKeyboardExtension
        embed: true

  GBoardKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: GBoardKeyboardExtension
      - path: Shared
    info:
      path: GBoardKeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: gbios
        CFBundleName: GBoardKeyboardExtension
        CFBundleExecutable: GBoardKeyboardExtension
        CFBundleIdentifier: com.gbios.app.keyboard
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        UIDeviceFamily:
          - 1
          - 2
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: GBoardKeyboardExtension.KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: GBoardKeyboardExtension/GBoardKeyboardExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbios.app.keyboard
        PRODUCT_NAME: GBoardKeyboardExtension
        PRODUCT_MODULE_NAME: GBoardKeyboardExtension
        INFOPLIST_FILE: GBoardKeyboardExtension/Info.plist
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.2.0
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        SKIP_INSTALL: NO
