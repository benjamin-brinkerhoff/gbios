name: Build & Release Unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA & Release
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application and Keyboard Extension (Unsigned)
        run: |
          xcodebuild \
            -project gbios.xcodeproj \
            -scheme GBoardApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find derivedData/Build/Products/Release-iphoneos -name "GBoardApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: GBoardApp.app not found in build products!"
            exit 1
          fi
          echo "Found built application: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/

          # Ensure KeyboardExtension is embedded in PlugIns
          EXT_PATH=$(find derivedData/Build/Products/Release-iphoneos -name "GBoardKeyboardExtension.appex" -type d | head -n 1)
          if [ -n "$EXT_PATH" ]; then
            mkdir -p build/Payload/GBoardApp.app/PlugIns
            rm -rf build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex
            cp -r "$EXT_PATH" build/Payload/GBoardApp.app/PlugIns/
          fi

          chmod -R u+w build/Payload/GBoardApp.app

          # Ensure executables have execute permissions
          chmod +x build/Payload/GBoardApp.app/GBoardApp
          if [ -f build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/GBoardKeyboardExtension ]; then
            chmod +x build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/GBoardKeyboardExtension
          fi

          # Fix CFBundleExecutable, CFBundleIdentifier, CFBundleName for Feather & ESign signing
          echo "Applying concrete metadata to GBoardApp Info.plist..."
          plutil -replace CFBundleExecutable -string "GBoardApp" build/Payload/GBoardApp.app/Info.plist
          plutil -replace CFBundleIdentifier -string "com.gbios.app" build/Payload/GBoardApp.app/Info.plist
          plutil -replace CFBundleName -string "GBoardApp" build/Payload/GBoardApp.app/Info.plist
          plutil -replace CFBundleDisplayName -string "gbios" build/Payload/GBoardApp.app/Info.plist
          plutil -replace CFBundleShortVersionString -string "1.1.0" build/Payload/GBoardApp.app/Info.plist
          plutil -replace CFBundleVersion -string "2" build/Payload/GBoardApp.app/Info.plist

          echo "Applying concrete metadata to GBoardKeyboardExtension Info.plist..."
          plutil -replace CFBundleExecutable -string "GBoardKeyboardExtension" build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/Info.plist
          plutil -replace CFBundleIdentifier -string "com.gbios.app.keyboard" build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/Info.plist
          plutil -replace CFBundleName -string "GBoardKeyboardExtension" build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/Info.plist
          plutil -replace CFBundleDisplayName -string "gbios" build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/Info.plist
          plutil -replace CFBundleShortVersionString -string "1.1.0" build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/Info.plist
          plutil -replace CFBundleVersion -string "2" build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/Info.plist

          # Convert to standard binary plist format
          plutil -convert binary1 build/Payload/GBoardApp.app/Info.plist
          plutil -convert binary1 build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/Info.plist

          # Verify keys
          echo "=== Verified GBoardApp Info.plist ==="
          plutil -p build/Payload/GBoardApp.app/Info.plist | grep -E "CFBundleExecutable|CFBundleIdentifier|CFBundleDisplayName|CFBundleShortVersionString"

          echo "=== Verified GBoardKeyboardExtension Info.plist ==="
          plutil -p build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/Info.plist | grep -E "CFBundleExecutable|CFBundleIdentifier|CFBundleDisplayName|CFBundleShortVersionString"

          # Remove code signatures and old provisioning profiles so sideloading tools sign cleanly
          rm -rf build/Payload/GBoardApp.app/_CodeSignature
          rm -rf build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/_CodeSignature
          rm -f build/Payload/GBoardApp.app/embedded.mobileprovision
          rm -f build/Payload/GBoardApp.app/PlugIns/GBoardKeyboardExtension.appex/embedded.mobileprovision

          # Ensure PkgInfo exists
          echo -n "APPL????" > build/Payload/GBoardApp.app/PkgInfo

          cd build
          zip -r -y gbios-unsigned.ipa Payload
          ls -lh gbios-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbios-unsigned-ipa
          path: build/gbios-unsigned.ipa
          retention-days: 30

      - name: Create GitHub Release with Unsigned IPA
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "gbios v1.1.${{ github.run_number }} (Unsigned IPA)"
          body: |
            Automated Unsigned IPA build of **gbios** (Gboard for iOS) from commit `${{ github.sha }}`.

            ### Fixes in this build:
            - **Feather & ESign Sideloading Compatibility**: Fixed unexpanded `$(EXECUTABLE_NAME)`, `$(PRODUCT_BUNDLE_IDENTIFIER)`, and `$(PRODUCT_NAME)` in both `GBoardApp` and `GBoardKeyboardExtension` `Info.plist` files.
            - **Embedded App Extension Verification**: Verified `GBoardKeyboardExtension.appex` is bundled with proper permissions and binary plist structure.
            - **Gboard In-Keyboard Translate**: Live translation bar supporting 13+ languages with language swap and offline dictionary.
          files: build/gbios-unsigned.ipa
          draft: false
          prerelease: false
          make_latest: true
